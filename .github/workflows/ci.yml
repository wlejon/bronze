name: CI

# Build + test on every push/PR, on all three platforms bronze ships for.
# This is the signal behind the "CI" badge. The run includes the oracle
# differential suite and the three.js milestone; the pixi milestone is
# excluded here for wall time (it alone is ~80% of the test step) and runs
# in the Nightly workflow's full suite instead, same three platforms.
#
# brass, the code generator, is the one sibling dependency; CMake fetches the
# head of its main at configure (cmake/bro_deps.cmake), so there is no checkout
# step for it and no submodule.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must match vcpkg.json's builtin-baseline — the manifest pins port versions,
  # this pins the vcpkg tool + scripts to the same commit (the runner's
  # preinstalled vcpkg drifts with every image update).
  VCPKG_COMMIT: 0b88aacde46a853151730fbe7d0b7ee45f4b6864
  VCPKG_FORCE_SYSTEM_BINARIES: "1"
  # Persist the sccache object cache in the GitHub Actions cache across runs.
  # Without this sccache silently falls back to per-runner LOCAL DISK, which is
  # wiped between runs — 0% hits, every object recompiled.
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IDLE_TIMEOUT: "0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-2022, triplet: x64-windows }
          - { name: linux,   os: ubuntu-24.04, triplet: x64-linux }
          - { name: macos,   os: macos-15,     triplet: arm64-osx }
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Ninja (macOS)
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ninja

      - name: Seed sccache tool cache
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ARCH="x64"; ASSET="sccache-v0.19.0-x86_64-pc-windows-msvc.tar.gz"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ARCH="arm64"; ASSET="sccache-v0.19.0-aarch64-apple-darwin.tar.gz"
          else
            ARCH="x64"; ASSET="sccache-v0.19.0-x86_64-unknown-linux-musl.tar.gz"
          fi
          DEST="$RUNNER_TOOL_CACHE/sccache/0.19.0/$ARCH"
          mkdir -p "$DEST"
          if (cd "$DEST" && gh release download v0.19.0 -R mozilla/sccache -p "$ASSET" -O "$ASSET" && tar -xzf "$ASSET" --strip-components=1 && rm -f "$ASSET"); then
            touch "${DEST}.complete"
          fi

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.19.0"

      # Put cl.exe on PATH so Windows can use the dev preset's Ninja generator
      # (this is what dev.cmd does locally). `bronze build` itself needs no
      # toolchain: it writes its programs with brass's own image writers.
      - name: MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # brass comes from the head of its main (cmake/bro_deps.cmake),
      # fetched at configure: no checkout step.

      # doctest is the only default vcpkg dependency; clone vcpkg at the same
      # commit the manifest baseline pins so tool + ports + scripts agree.
      - name: vcpkg (pinned)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --reference-if-able "${VCPKG_INSTALLATION_ROOT:-}" https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_COMMIT"
          . "$RUNNER_TEMP/vcpkg/scripts/vcpkg-tool-metadata.txt"
          if [ "$RUNNER_OS" = "Windows" ]; then
            gh release download "$VCPKG_TOOL_RELEASE_TAG" -R microsoft/vcpkg-tool -p "vcpkg.exe" -O "$RUNNER_TEMP/vcpkg/vcpkg.exe" || "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          elif [ "$RUNNER_OS" = "Linux" ]; then
            (gh release download "$VCPKG_TOOL_RELEASE_TAG" -R microsoft/vcpkg-tool -p "vcpkg-glibc" -O "$RUNNER_TEMP/vcpkg/vcpkg" && chmod +x "$RUNNER_TEMP/vcpkg/vcpkg") || "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          else
            (gh release download "$VCPKG_TOOL_RELEASE_TAG" -R microsoft/vcpkg-tool -p "vcpkg-macos" -O "$RUNNER_TEMP/vcpkg/vcpkg" && chmod +x "$RUNNER_TEMP/vcpkg/vcpkg") || "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          touch "$RUNNER_TEMP/vcpkg/vcpkg.disable-metrics"
          mkdir -p "$RUNNER_TEMP/vcpkg-bincache"
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-bincache" >> "$GITHUB_ENV"

      # Persist vcpkg's built-package archives (just doctest today, but the
      # scheme scales): per-run key + restore-keys pick the newest prior cache,
      # avoiding the "exact key exists, skip save" trap after a rebuild.
      - name: vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: vcpkg-bin-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bin-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-bin-${{ matrix.triplet }}-

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Embedded debug info (/Z7) instead of a separate PDB (/Zi) is what
            # lets sccache cache MSVC objects at all.
            EXTRA="-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded"
          fi
          cmake --preset dev \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            $EXTRA

      - name: Build
        run: cmake --build --preset dev --parallel 4

      # Everything except the pixi milestone and external cabi tests. Compiling
      # the 2 MB pixi bundle twice plus its gc-stress re-runs is ~80% of this job's
      # wall time on these runners; threejs stays per-push as the real-library smoke.
      - name: Test
        env:
          BRONZE_TEST_JOBS: 4
        run: ctest --preset dev --parallel 4 -LE "pixi|cabi|tiers|deopt-stress|release-stress|feedback|perf"
